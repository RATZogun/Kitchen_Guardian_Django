{% extends "base.html" %}
{% block titulo %}Excluir · Guardião da Cozinha{% endblock %}
{% block conteudo %}
<div class="container py-4" style="max-width: 640px">
    <div class="card border-danger">
        <div class="card-body">
            <h1 class="h4"><i class="bi bi-trash text-danger"></i> Excluir {{ object|default:"registro" }}?</h1>
            <p class="text-body-secondary mb-4">Essa ação não pode ser desfeita.</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Sim, excluir</button>
                <a class="btn btn-outline-secondary" href="javascript:history.back()">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
