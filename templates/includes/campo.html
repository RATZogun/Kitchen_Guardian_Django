<div class="col-md-6">
    <label class="form-label" for="{{ campo.id_for_label }}">{{ campo.label|capfirst }}{% if campo.field.required %} <span class="text-danger">*</span>{% endif %}</label>
    {{ campo }}
    {% if campo.help_text %}<div class="form-text">{{ campo.help_text|safe }}</div>{% endif %}
    {% for e in campo.errors %}<div class="invalid-feedback d-block">{{ e }}</div>{% endfor %}
</div>
